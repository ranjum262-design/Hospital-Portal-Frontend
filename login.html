<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4 border-0 rounded-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <i class="fas fa-user-circle text-primary display-4"></i>
      <h2 class="fw-bold mt-2">Welcome Back</h2>
      <p class="text-muted small">Please login to your health portal</p>
    </div>
    
    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label small fw-bold">Email Address</label>
        <input 
          type="email" 
          name="email" 
          [(ngModel)]="credentials.email" 
          class="form-control rounded-pill px-3" 
          placeholder="name@example.com" 
          required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">Password</label>
        <input 
          type="password" 
          name="password" 
          [(ngModel)]="credentials.password" 
          class="form-control rounded-pill px-3" 
          placeholder="Enter password" 
          required>
      </div>
      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
        Login
      </button>
    </form>
    
    <div class="text-center mt-3">
      <p class="small text-muted">New user? <a routerLink="/register" class="text-decoration-none fw-bold">Create an account</a></p>
    </div>
  </div>
</div>
