<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4 border-0 rounded-4" style="max-width: 450px; width: 100%;">
    <div class="text-center mb-4">
      <i class="fas fa-user-plus text-success display-4"></i>
      <h2 class="fw-bold mt-2">Join Us</h2>
      <p class="text-muted small">Start your health journey today</p>
    </div>
    
    <form (ngSubmit)="onSignup()">
      <div class="mb-3">
        <label class="form-label small fw-bold">Full Name</label>
        <input type="text" name="fullName" [(ngModel)]="user.fullName" class="form-control rounded-pill px-3" placeholder="John Doe" required>
      </div>
      
      <div class="mb-3">
        <label class="form-label small fw-bold">Email</label>
        <input type="email" name="email" [(ngModel)]="user.email" class="form-control rounded-pill px-3" placeholder="email@example.com" required>
      </div>
      
      <div class="mb-3">
        <label class="form-label small fw-bold">Password</label>
        <input type="password" name="password" [(ngModel)]="user.password" class="form-control rounded-pill px-3" placeholder="Create password" required>
      </div>
      
      <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-bold shadow-sm">
        Register Now
      </button>
    </form>
    
    <div class="text-center mt-3">
      <p class="small text-muted">Already have an account? <a routerLink="/login" class="text-decoration-none fw-bold">Login here</a></p>
    </div>
  </div>
</div>
