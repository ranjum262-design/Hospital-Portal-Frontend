<div class="card border-0 shadow-sm overflow-hidden d-flex flex-column" style="height: 100%; min-height: 550px;">
  <div class="card-header-media">
    <div *ngIf="(topic.category === 'Education' || topic.category === 'Exercises') && topic.videoUrl" class="ratio ratio-16x9">
      <iframe [src]="topic.videoUrl | safe" allowfullscreen class="rounded-top" frameborder="0"></iframe>
    </div>

    <div *ngIf="topic.category === 'Nutrition'" class="p-3 bg-success-subtle border-bottom" style="max-height: 250px; overflow-y: auto;">
      <h6 class="text-success fw-bold mb-2 small"><i class="fas fa-utensils me-2"></i> RECIPE / GUIDELINES</h6>
      <ul class="list-unstyled mb-0">
        <li *ngFor="let note of topic.notes" class="small mb-2 d-flex align-items-start">
          <i class="fas fa-check text-success me-2 mt-1" style="font-size: 0.7rem;"></i>
          <span style="line-height: 1.3;">{{ note }}</span>
        </li>
      </ul>
    </div>
  </div>

  <div class="card-body p-4 d-flex flex-column flex-grow-1">
    <div class="mb-3">
      <span class="badge rounded-pill px-3 py-2" 
            [ngClass]="topic.category === 'Nutrition' ? 'bg-success text-white' : 'bg-light text-dark border'">
        {{ topic.category }}
      </span>
    </div>
    
    <h5 class="card-title fw-bold mb-2">{{ topic.title }}</h5>
    
    <p class="card-text text-muted small mt-auto">
      {{ topic.description }}
    </p>
  </div>
</div>
